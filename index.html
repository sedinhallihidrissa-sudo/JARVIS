<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000814">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>JARVIS AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>J.A.R.V.I.S</h1>
    <span id="status" class="status">EN LIGNE · MODE LOCAL</span>
  </header>

  <section class="core-zone">
    <div id="core" class="core">
      <div class="ring r1"></div>
      <div class="ring r2"></div>
      <div class="ring r3"></div>
      <div class="center"></div>
    </div>
  </section>

  <main id="chat" class="chat" aria-live="polite"></main>

  <form id="form" class="bar">
    <button type="button" id="micBtn" class="icon" aria-label="Micro">🎤</button>
    <input id="input" type="text" placeholder="Parle à JARVIS..." autocomplete="off">
    <button type="submit" class="icon send" aria-label="Envoyer">➤</button>
  </form>
  <div class="options">
    <label><input type="checkbox" id="voiceToggle" checked> Voix activée</label>
  </div>

  <script src="app.js"></script>
</body>
</html>
